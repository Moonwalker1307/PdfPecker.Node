# Weekly pull requests for new versions of the pinned GitHub Actions and of koffi. PdfPecker itself is not updated
# here: its version moves with each library release, in a pull request that changes package.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
